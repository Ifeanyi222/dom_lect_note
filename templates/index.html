<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleHub | Clothing Store</title>
    <!-- Link the external CSS file -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <header>
        <h1>STYLEHUB</h1>
        <div id="cartStatus" class="cart-badge">Cart: 0 items</div>
    </header>

    <div class="container">
        <div class="product-card">
            <div class="product-image" id="productImage">
                <img src="/static/images/download.webp" alt="Classic Cotton Hoodie">
            </div>
            <div class="product-details">
                <h2 id="productName">Classic Cotton Hoodie</h2>
                <div class="price" id="productPrice">45000</div>
                <p class="description">Premium heavyweight organic cotton engineered for ultimate everyday comfort and durability.</p>

                <div class="section-title">Select Size:</div>
                <div class="sizes">
                    <button class="size-btn active" data-size="S">S</button>
                    <button class="size-btn" data-size="M">M</button>
                    <button class="size-btn" data-size="L">L</button>
                    <button class="size-btn" data-size="XL">XL</button>
                </div>

                <button class="buy-btn" id="addToCartBtn">Add to Cart</button>
                <div class="notification" id="feedbackMsg"></div>
            </div>
        </div>
    </div>

    <!-- Link the external JavaScript file before the closing body tag -->
    <script src="/static/js/script.js"></script>
</body>
</html>
